<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 业余无线电模拟训练</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f4f6fb;color:#1b2434;font:16px/1.7 -apple-system,BlinkMacSystemFont,
       "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .box{text-align:center;padding:40px}
  h1{font-size:52px;margin:0 0 8px;color:#2f6df6}
  p{color:#5a6a80;margin:0 0 22px}
  a{display:inline-block;background:#2f6df6;color:#fff;text-decoration:none;
    padding:12px 26px;border-radius:11px;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>这个地址没有内容，模拟训练只有一个页面。</p>
    <a id="home" href="./">回到模拟训练</a>
  </div>
  <script>
    // GitHub Pages 的项目站点在 /<仓库名>/ 下，绝对路径 "/" 会跑出站点，
    // 所以按路径第一段回到本站根目录。
    (function () {
      var seg = location.pathname.split("/").filter(Boolean);
      if (seg.length > 1) document.getElementById("home").href = "/" + seg[0] + "/";
    })();
  </script>
</body>
</html>
